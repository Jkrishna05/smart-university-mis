# ============================================================
# OIT MIS — Continuous Deployment (CD) Pipeline
# ============================================================
# Triggers: Push to main branch
# ============================================================

name: CD — Production Build & Deploy

on:
  push:
    branches: [main]

jobs:
  # ── Step 1: Production Docker Build & Test ────────────────
  build-production-images:
    name: Build Production Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Production Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: orion-mis-backend:latest

      - name: Build Frontend Production Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: orion-mis-frontend:latest

      - name: Summary
        run: |
          echo "### 🐳 Production Docker Images Built & Verified" >> $GITHUB_STEP_SUMMARY
          echo "Both Backend and Frontend production containers built cleanly." >> $GITHUB_STEP_SUMMARY

  # ── Step 2: SSH Deploy to Cloud Server ───────────────────
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: build-production-images

    steps:
      - name: Check Cloud Server Configuration
        id: check_config
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "ℹ️ DEPLOY_HOST secret is not set. Skipping live SSH deployment step."
            echo "deploy_enabled=false" >> $GITHUB_ENV
          else
            echo "deploy_enabled=true" >> $GITHUB_ENV
          fi

      - name: Checkout code
        if: env.deploy_enabled == 'true'
        uses: actions/checkout@v4

      - name: Deploy via SSH
        if: env.deploy_enabled == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH || '/opt/oit-mis' }}
            sudo chown -R $(whoami) . 2>/dev/null || true
            git config --global --add safe.directory '*'
            git pull origin main
            # Create temporary cert if missing so Nginx boots
            if [ ! -f certbot/conf/live/cert.pem ]; then
              sudo openssl req -x509 -nodes -newkey rsa:2048 \
                -keyout certbot/conf/live/key.pem \
                -out certbot/conf/live/cert.pem \
                -days 365 \
                -subj "/CN=${{ secrets.DEPLOY_HOST }}.nip.io" || true
            fi

            docker compose -f docker-compose.prod.yml up -d --build

            # Request real Let's Encrypt certificate for trusted 🔒 padlock
            docker compose -f docker-compose.prod.yml run --rm certbot certonly \
              --webroot --webroot-path=/var/www/certbot \
              --register-unsafely-without-email --agree-tos \
              -d "${{ secrets.DEPLOY_HOST }}.nip.io" --non-interactive || true

            # Apply Let's Encrypt cert and reload nginx
            LE_DIR="certbot/conf/live/${{ secrets.DEPLOY_HOST }}.nip.io"
            if [ -f "$LE_DIR/fullchain.pem" ]; then
              sudo cp "$LE_DIR/fullchain.pem" certbot/conf/live/cert.pem
              sudo cp "$LE_DIR/privkey.pem" certbot/conf/live/key.pem
              docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload || true
            fi

            docker image prune -f
